<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌿 ecoprint store - Sabang</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--primary:#2D6A4F;--primary-dark:#1B4332;--primary-light:#40916C;--secondary:#D4A373;--accent:#B08968;--bg:#F5F0EB;--card:#FFFFFF;--text:#1E1E2F;--text-light:#5C6B73;--border:#D8CCC0;--shadow:0 8px 30px rgba(45,106,79,.15);--radius:16px;--radius-sm:10px;--transition:.3s cubic-bezier(.4,0,.2,1)}
body.dark-mode{--bg:#1a1a2e;--card:#16213e;--text:#e2e8f0;--text-light:#94a3b8;--border:#334155;--shadow:0 8px 30px rgba(0,0,0,.5)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:16px;transition:background .3s,color .3s}
.app-container{max-width:1280px;margin:0 auto;padding:0 20px;width:100%;flex:1}
.navbar{background:rgba(255,255,255,.92);padding:14px 0;box-shadow:0 2px 20px rgba(0,0,0,.05);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);transition:background .3s}
body.dark-mode .navbar{background:rgba(22,33,62,.92)}
.navbar .app-container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.nav-brand{font-size:28px;font-weight:900;color:var(--primary);display:flex;align-items:center;gap:6px;letter-spacing:-.5px}
.nav-brand .logo-icon{font-size:32px;line-height:1}
.nav-brand span{color:var(--secondary)}
.nav-brand small{font-size:12px;font-weight:400;color:var(--text-light);margin-left:4px;letter-spacing:0}
.nav-menu{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-menu .btn{padding:8px 18px;border-radius:50px;font-weight:600;font-size:14px;transition:var(--transition);background:transparent;color:var(--text-light)}
.nav-menu .btn:hover{background:var(--bg);color:var(--text)}
.nav-menu .btn-primary{background:var(--primary);color:#fff}
.nav-menu .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 15px rgba(45,106,79,.35)}
.nav-menu .btn-outline{border:2px solid var(--border)}
.nav-menu .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.nav-badge{background:var(--secondary);color:#fff;border-radius:50%;padding:0 8px;font-size:11px;font-weight:700;line-height:20px;display:inline-block;min-width:20px;text-align:center}
.btn{padding:10px 24px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;justify-content:center;border:2px solid transparent;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.3)}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-secondary:hover{background:#C4956A;transform:translateY(-2px)}
.btn-outline{border-color:var(--border);background:transparent;color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:rgba(45,106,79,.05)}
.btn-danger{background:#EF4444;color:#fff}
.btn-danger:hover{background:#DC2626}
.btn-success{background:#10B981;color:#fff}
.btn-info{background:#3B82F6;color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;transition:var(--transition)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.card-title{font-size:18px;font-weight:700}
.auth-wrapper{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:30px 0}
.auth-container{max-width:480px;width:100%;margin:0 auto}
.auth-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px 36px;border:1px solid var(--border)}
.auth-header{text-align:center;margin-bottom:28px}
.auth-header .icon{font-size:52px;margin-bottom:8px;display:block}
.auth-header h2{font-size:26px;font-weight:800;margin-bottom:4px}
.auth-header p{color:var(--text-light);font-size:15px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.auth-form .input-wrapper{position:relative;display:flex;align-items:center;background:var(--bg);border-radius:var(--radius-sm);border:2px solid var(--border);transition:var(--transition)}
.auth-form .input-wrapper:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(45,106,79,.12)}
.auth-form .input-wrapper .input-icon{padding:0 14px;font-size:18px;color:var(--text-light)}
.auth-form .input-wrapper input{width:100%;padding:12px 14px 12px 4px;border:none;background:transparent;font-size:15px;color:var(--text);outline:none;font-weight:500}
.auth-form .btn-submit{margin-top:8px;padding:14px;font-size:16px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-weight:700;border:none;width:100%;cursor:pointer;transition:var(--transition)}
.auth-form .btn-submit:hover{background:var(--primary-dark);transform:translateY(-2px)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat-label{font-size:14px;color:var(--text-light);font-weight:500}
.stat-value{font-size:28px;font-weight:800;margin-top:4px}
.stat-card.purple{border-left-color:#8B5CF6}.stat-card.green{border-left-color:#10B981}.stat-card.orange{border-left-color:#F59E0B}.stat-card.pink{border-left-color:#EC4899}.stat-card.blue{border-left-color:#3B82F6}.stat-card.red{border-left-color:#EF4444}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--bg)}
th{padding:12px 16px;text-align:left;font-weight:700;color:var(--text-light);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 16px;border-top:1px solid var(--border)}
tr:hover td{background:rgba(45,106,79,.03)}
.badge{display:inline-block;padding:4px 12px;border-radius:50px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-success{background:#D1FAE5;color:#065F46}
.badge-warning{background:#FEF3C7;color:#92400E}
.badge-danger{background:#FEE2E2;color:#991B1B}
.badge-info{background:#DBEAFE;color:#1E40AF}
.badge-primary{background:#E0E7FF;color:#3730A3}
.badge-secondary{background:#E5E7EB;color:#374151}
.product-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:var(--transition);position:relative}
.product-card:hover{transform:translateY(-6px);box-shadow:0 16px 48px rgba(45,106,79,.15)}
.product-img{height:220px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-light);position:relative;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-body{padding:16px}
.product-name{font-weight:700;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.product-category{font-size:12px;color:var(--text-light);margin:2px 0 4px}
.product-price{font-size:18px;font-weight:800;color:var(--primary)}
.product-stock{font-size:12px;color:var(--text-light)}
.product-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.product-actions .btn{flex:1;min-width:60px;font-size:12px;padding:8px 12px}
.brand-tag{position:absolute;top:10px;left:10px;background:rgba(45,106,79,.85);color:#fff;font-size:11px;padding:4px 12px;border-radius:20px;font-weight:600;z-index:2;text-transform:uppercase;letter-spacing:.5px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .icon{font-size:56px;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:18px;color:var(--text);margin-bottom:4px}
.slider-container{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:32px;box-shadow:var(--shadow)}
.slider-track{display:flex;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
.slider-slide{min-width:100%;height:420px;position:relative;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.slider-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.35);backdrop-filter:blur(4px);border:none;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);z-index:10}
.slider-btn:hover{background:rgba(255,255,255,.6);color:var(--primary)}
.slider-btn.prev{left:16px}.slider-btn.next{right:16px}
.slider-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.slider-dots button{width:12px;height:12px;border-radius:50%;border:none;background:rgba(255,255,255,.45);transition:var(--transition);cursor:pointer;padding:0}
.slider-dots button.active{background:#fff;transform:scale(1.2)}
.slider-slide.hero-slide{height:auto;min-height:440px;padding:48px 40px;background:linear-gradient(135deg,#14342a 0%,var(--primary-dark) 42%,var(--primary-light) 100%);align-items:center;justify-content:center;overflow:hidden}
.slider-slide.hero-slide::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.16),transparent 52%),radial-gradient(circle at 6% 92%,rgba(212,163,115,.28),transparent 46%)}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;width:100%;max-width:1140px;margin:0 auto;color:#fff}
.hero-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:6px 16px;border-radius:50px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;backdrop-filter:blur(4px)}
.hero-text h2{font-size:42px;font-weight:900;line-height:1.12;letter-spacing:-.5px;text-shadow:0 4px 24px rgba(0,0,0,.25)}
.hero-text .hero-desc{margin:14px 0 18px;font-size:16px;line-height:1.6;color:rgba(255,255,255,.86);max-width:440px}
.hero-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.hero-price .amount{font-size:34px;font-weight:900;color:#FFE3B0}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-cta .btn{border-radius:50px;padding:13px 30px;font-size:15px;font-weight:700}
.hero-btn{background:#fff;color:var(--primary-dark);border:none}
.hero-btn:hover{background:#FFE3B0;transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.hero-btn-ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}
.hero-btn-ghost:hover{background:rgba(255,255,255,.14);border-color:#fff}
.hero-gallery{display:flex;flex-direction:column;gap:12px}
.hero-main-img{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 26px 60px rgba(0,0,0,.42);background:#fff}
.hero-main-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-main-img .hero-tag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.94);color:var(--primary-dark);font-size:11px;font-weight:800;padding:6px 14px;border-radius:50px;letter-spacing:.5px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.hero-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero-thumb{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;border:2px solid rgba(255,255,255,.35);transition:var(--transition);background:#fff}
.hero-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.hero-thumb:hover{transform:translateY(-4px);border-color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.hero-thumb:hover img{transform:scale(1.08)}
.hero-thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){.hero-inner{grid-template-columns:1fr;gap:24px}.slider-slide.hero-slide{padding:28px 20px;min-height:auto}.hero-text h2{font-size:28px}.hero-price .amount{font-size:26px}.hero-text .hero-desc{font-size:14px;margin:10px 0 14px}.hero-cta .btn{padding:11px 22px;font-size:13px}}
.promo-banner{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:var(--radius);padding:30px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px;position:relative;overflow:hidden;animation:promoPulse 3s infinite alternate}
.promo-banner::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.15);z-index:0}
.promo-banner .text,.promo-banner .btn{position:relative;z-index:1}
@keyframes promoPulse{0%{box-shadow:0 4px 30px rgba(45,106,79,.3)}100%{box-shadow:0 8px 60px rgba(45,106,79,.6)}}
.promo-banner .text h2{font-size:26px;font-weight:800}
.promo-banner .text p{opacity:.9;font-size:16px}
.promo-banner .btn{background:#fff;color:var(--primary);font-weight:700;padding:12px 32px;border-radius:50px}
.promo-banner .btn:hover{transform:scale(1.05)}
.back-nav{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.back-nav .btn-back{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:50px;background:var(--card);border:2px solid var(--border);font-weight:600;font-size:14px;transition:var(--transition);color:var(--text);cursor:pointer}
.back-nav .btn-back:hover{border-color:var(--primary);color:var(--primary);transform:translateX(-3px)}
.qty-selector{display:flex;align-items:center;gap:12px;margin:8px 0}
.qty-selector button{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);font-size:18px;font-weight:700;background:#fff;transition:var(--transition);cursor:pointer}
.qty-selector button:hover{border-color:var(--primary);color:var(--primary)}
.qty-selector span{font-size:20px;font-weight:700;min-width:40px;text-align:center}
.cart-item{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.cart-item-img{width:64px;height:64px;border-radius:var(--radius-sm);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1}
.cart-item-info .name{font-weight:600}
.cart-item-info .price{color:var(--text-light);font-size:14px}
.cart-item-qty{display:flex;align-items:center;gap:8px}
.cart-item-qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);font-weight:700;background:var(--card);cursor:pointer}
.cart-item-qty button:hover{border-color:var(--primary);color:var(--primary)}
.cart-item-qty span{font-weight:700;min-width:24px;text-align:center}
.toast-container{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%}
.toast{padding:14px 20px;border-radius:var(--radius-sm);background:var(--card);box-shadow:0 10px 40px rgba(0,0,0,.12);border-left:4px solid var(--primary);animation:slideIn .3s ease;display:flex;align-items:center;gap:12px;font-weight:500;font-size:14px;color:var(--text)}
.toast.success{border-left-color:#10B981}.toast.error{border-left-color:#EF4444}.toast.warning{border-left-color:#F59E0B}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast .toast-close{margin-left:auto;font-size:18px;cursor:pointer;opacity:.5}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal{background:var(--card);border-radius:var(--radius);padding:32px;max-width:600px;width:92%;max-height:90vh;overflow-y:auto;animation:scaleIn .25s ease;box-shadow:0 24px 64px rgba(0,0,0,.2);color:var(--text)}
.modal-lg{max-width:800px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-header h2{font-size:22px}
.modal-close{font-size:28px;cursor:pointer;opacity:.5;transition:var(--transition);line-height:1}
.modal-close:hover{opacity:1;transform:rotate(90deg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.section{padding:30px 0}
.section-title{font-size:24px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.text-center{text-align:center}.text-muted{color:var(--text-light)}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.flex-center{display:flex;align-items:center;justify-content:center}
.flex-wrap{flex-wrap:wrap}
.gap-8{gap:8px}.gap-16{gap:16px}
.w-full{width:100%}
.fw-700{font-weight:700}
.fs-12{font-size:12px}.fs-14{font-size:14px}.fs-20{font-size:20px}
.divider{border:none;border-top:2px solid var(--border);margin:16px 0}
.skripsi-title{background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));color:#fff;padding:16px 24px;border-radius:var(--radius);text-align:center;margin-bottom:24px;font-size:20px;font-weight:700;letter-spacing:.5px;box-shadow:0 4px 20px rgba(45,106,79,.25)}
.skripsi-title small{display:block;font-weight:400;font-size:14px;opacity:.9;margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;transition:var(--transition);font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
.form-group .help{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.5}
.form-group .help code{background:var(--bg);padding:1px 6px;border-radius:4px;color:var(--primary);font-size:11px}
.file-preview{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center;margin-top:8px;background:var(--bg)}
.file-preview img{max-height:200px;margin:0 auto;max-width:100%;border-radius:8px}
.search-box{position:relative;flex:1;min-width:200px}
.search-box input{width:100%;padding:10px 14px 10px 40px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
.search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;z-index:1}
.category-pills{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.category-pills button{padding:6px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);font-weight:600;font-size:12px;cursor:pointer;transition:var(--transition);color:var(--text)}
.category-pills button.active,.category-pills button:hover{border-color:var(--primary);background:var(--primary);color:#fff}
.status-badge-0{background:#FEF3C7;color:#92400E}
.status-badge-1{background:#DBEAFE;color:#1E40AF}
.status-badge-2{background:#E0E7FF;color:#3730A3}
.status-badge-3{background:#D1FAE5;color:#065F46}
.status-badge-4{background:#E5E7EB;color:#374151}
.info-banner{background:var(--secondary);color:#fff;text-align:center;padding:10px;border-radius:var(--radius-sm);margin-bottom:16px;font-weight:600;animation:promoPulse 2s infinite alternate}
.invoice-print{background:#fff;color:#000;padding:30px;max-width:800px;margin:0 auto}
.invoice-print h1{font-size:24px;margin-bottom:4px}
.invoice-print .header{text-align:center;border-bottom:3px double #333;padding-bottom:16px;margin-bottom:20px}
.invoice-print table{width:100%;border-collapse:collapse;margin:12px 0}
.invoice-print th,.invoice-print td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px}
.invoice-print th{background:#f5f5f5}
.invoice-print .info-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.invoice-print .total{font-size:18px;font-weight:800;color:#2D6A4F}

const CATEGORIES = ['Semua','Kain/Bahan Ecoprint','Dress','Gamis','Gaun','Kaos','Kemeja','Kimono','Rompi','Totebag'];
const STATUS_PESANAN = ['Menunggu Pembayaran','Diproses','Dikirim','Selesai','Dibatalkan'];

const DB = {
    get(key, def) { try { const d = localStorage.getItem('ecoprint_' + key); return d ? JSON.parse(d) : (def !== undefined ? def : null); } catch { return def; } },
    set(key, val) { try { localStorage.setItem('ecoprint_' + key, JSON.stringify(val)); return true; } catch (e) { console.error('Storage error:', e); return false; } },
    push(key, item) { const arr = this.get(key, []); arr.push(item); this.set(key, arr); return arr; },
    find(key, pred) { return this.get(key, []).find(pred); },
    filter(key, pred) { return this.get(key, []).filter(pred); },
    update(key, pred, upd) { const arr = this.get(key, []); const idx = arr.findIndex(pred); if (idx !== -1) { arr[idx] = { ...arr[idx], ...upd }; this.set(key, arr); return arr[idx]; } return null; },
    remove(key, pred) { const arr = this.get(key, []); const f = arr.filter(p => !pred(p)); this.set(key, f); return f; }
};

const PhotoStorage = {
    getAll() { return DB.get('photos', {}); },
    get(productId) { return this.getAll()[productId] || null; },
    set(productId, dataUrl) { const all = this.getAll(); all[productId] = dataUrl; return DB.set('photos', all); },
    remove(productId) { const all = this.getAll(); delete all[productId]; DB.set('photos', all); },
    clear() { DB.set('photos', {}); },
    count() { return Object.keys(this.getAll()).length; },
    sizeKB() { const all = this.getAll(); let total = 0; Object.values(all).forEach(v => total += v.length); return Math.round(total / 1024); },
    has(productId) { return !!this.get(productId); }
};

const Helpers = {
    date() { return new Date().toISOString(); },
    todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); },
    nowTime() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); },
    formatDate(d) { try { return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); } catch { return d; } },
    formatDateTime(d) { try { return new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch { return d; } },
    formatRupiah(n) { return 'Rp ' + Number(n||0).toLocaleString('id-ID'); },
    invoiceId() { const today = Helpers.todayStr().replace(/-/g,''); const prefix = 'INV-' + today + '-'; const trx = DB.get('transactions', []); const todayTrx = trx.filter(t => t.id && t.id.startsWith(prefix)); return prefix + String(todayTrx.length + 1).padStart(3,'0'); },
    stockStatus(stok) { if (stok <= 0) return { label: 'Habis', class: 'badge-danger' }; if (stok <= 5) return { label: 'Stok Menipis', class: 'badge-warning' }; return { label: 'Tersedia', class: 'badge-success' }; },
    slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); },
    fileToDataUrl(file, maxDim = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            if (!file || !file.type || !/^image\//.test(file.type)) { reject(new Error('Bukan file gambar')); return; }
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) { const r = Math.min(maxDim / w, maxDim / h); w = Math.round(w * r); h = Math.round(h * r); }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    } catch (err) { reject(err); }
                };
                img.onerror = () => reject(new Error('Gagal membaca gambar'));
                img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error('Gagal membaca file'));
            reader.readAsDataURL(file);
        });
    },
    productIllustration(name, category) {
        const nama = String(name || 'Produk Ecoprint'); const kat  = String(category || 'Ecoprint Sabang');
        const palettes = { 'Kain/Bahan Ecoprint': [['#1B4332','#52B788'], ['#2D6A4F','#95D5B2'], ['#40916C','#74C69D']], 'Dress': [['#7B2CBF','#C77DFF'], ['#9D4EDD','#E0AAFF'], ['#5A189A','#9D4EDD']], 'Gamis': [['#8A5A44','#DDB892'], ['#B08968','#FAEDCD'], ['#6F4E37','#D4A373']], 'Gaun': [['#B56576','#E5989B'], ['#6D597A','#B56576'], ['#E5989B','#FFCDB2']], 'Kaos': [['#283618','#A3B18A'], ['#4A5D23','#606C38'], ['#335C67','#7FA8B8']], 'Kemeja': [['#293241','#3D5A80'], ['#3D5A80','#98C1D9'], ['#EE6C4D','#FFB627']], 'Kimono': [['#5F0F40','#9A031E'], ['#FB8B24','#E36414'], ['#0F4C5C','#5F0F40']], 'Rompi': [['#4A4E69','#9A8C98'], ['#6D4C7D','#B79CC7'], ['#8B5E3C','#C6AC8F']], 'Totebag': [['#7D8CC4','#A9B7E0'], ['#9A8C98','#C9ADA7'], ['#8A817C','#BCB8B1']] };
        let h = 0; for (let i = 0; i < nama.length; i++) h = (h * 31 + nama.charCodeAt(i)) % 99991;
        const arr = palettes[kat] || palettes['Kaos']; const pal = arr[h % arr.length]; let shape = '';
        if (kat === 'Kain/Bahan Ecoprint') { shape = `<rect x="120" y="140" width="360" height="360" rx="14" fill="url(#shape)" opacity=".92"/><g fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.5"><ellipse cx="200" cy="230" rx="42" ry="20" transform="rotate(-30 200 230)"/><ellipse cx="390" cy="380" rx="52" ry="24" transform="rotate(25 390 380)"/><ellipse cx="260" cy="430" rx="38" ry="18" transform="rotate(-18 260 430)"/><ellipse cx="400" cy="240" rx="34" ry="16" transform="rotate(45 400 240)"/><ellipse cx="190" cy="380" rx="44" ry="20" transform="rotate(8 190 380)"/></g>`; }
        else if (kat === 'Dress') { shape = `<path d="M240 170 L262 130 L338 130 L360 170 L400 300 L422 460 L178 460 L200 300 Z" fill="url(#shape)" opacity=".92"/><path d="M262 200 L300 250 L338 200" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/>`; }
        else if (kat === 'Gaun') { shape = `<path d="M245 165 L265 130 L335 130 L355 165 L420 440 Q420 470 390 470 L210 470 Q180 470 180 440 Z" fill="url(#shape)" opacity=".92"/><path d="M265 200 Q300 230 335 200" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/>`; }
        else if (kat === 'Gamis') { shape = `<path d="M235 165 L260 130 L340 130 L365 165 L380 470 L220 470 Z" fill="url(#shape)" opacity=".92"/><path d="M260 200 Q300 235 340 200" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/><rect x="245" y="380" width="110" height="14" rx="4" fill="rgba(255,255,255,.35)"/>`; }
        else if (kat === 'Kaos') { shape = `<path d="M215 175 L235 155 L280 175 L320 175 L365 155 L385 175 L360 245 L380 430 L220 430 L240 245 Z" fill="url(#shape)" opacity=".92"/><path d="M270 175 Q300 205 330 175" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"/>`; }
        else if (kat === 'Kemeja') { shape = `<path d="M215 175 L240 155 L275 175 L300 175 L300 200 L300 175 L325 175 L360 155 L385 175 L360 245 L380 440 L220 440 L240 245 Z" fill="url(#shape)" opacity=".92"/><circle cx="300" cy="220" r="4" fill="rgba(255,255,255,.7)"/><circle cx="300" cy="260" r="4" fill="rgba(255,255,255,.7)"/><circle cx="300" cy="300" r="4" fill="rgba(255,255,255,.7)"/><circle cx="300" cy="340" r="4" fill="rgba(255,255,255,.7)"/><circle cx="300" cy="380" r="4" fill="rgba(255,255,255,.7)"/>`; }
        else if (kat === 'Kimono') { shape = `<path d="M215 175 L260 155 L340 155 L385 175 L405 250 L365 265 L365 450 L235 450 L235 265 L195 250 Z" fill="url(#shape)" opacity=".92"/><rect x="235" y="300" width="130" height="22" fill="rgba(255,255,255,.55)"/><path d="M275 155 L300 240 L325 155" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/>`; }
        else if (kat === 'Rompi') { shape = `<path d="M240 175 L265 155 L295 175 L295 445 L200 445 L220 255 Z M360 175 L335 155 L305 175 L305 445 L400 445 L380 255 Z" fill="url(#shape)" opacity=".92"/>`; }
        else if (kat === 'Totebag') { shape = `<rect x="175" y="245" width="250" height="220" rx="10" fill="url(#shape)" opacity=".92"/><path d="M235 245 Q235 175 300 175 Q365 175 365 245" fill="none" stroke="${pal[0]}" stroke-width="10" stroke-linecap="round"/><rect x="200" y="320" width="200" height="3" fill="rgba(255,255,255,.4)"/>`; }
        else { shape = `<circle cx="300" cy="300" r="150" fill="url(#shape)" opacity=".9"/>`; }
        const nm = nama.length > 26 ? nama.slice(0, 25) + '…' : nama;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient><linearGradient id="shape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.45)"/><stop offset="1" stop-color="rgba(255,255,255,.18)"/></linearGradient></defs><rect width="600" height="600" fill="url(#bg)"/><g fill="rgba(255,255,255,.10)"><ellipse cx="70" cy="80" rx="60" ry="20" transform="rotate(-30 70 80)"/><ellipse cx="530" cy="90" rx="55" ry="18" transform="rotate(30 530 90)"/><ellipse cx="550" cy="520" rx="70" ry="22" transform="rotate(-20 550 520)"/><ellipse cx="50" cy="530" rx="55" ry="18" transform="rotate(25 50 530)"/><circle cx="60" cy="200" r="35"/><circle cx="540" cy="380" r="40"/></g>${shape}<rect x="50" y="510" width="500" height="62" rx="31" fill="rgba(0,0,0,.55)"/><text x="300" y="549" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">${escapeHtml(nm)}</text><rect x="150" y="28" width="300" height="34" rx="17" fill="rgba(255,255,255,.94)"/><text x="300" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="${pal[0]}" text-anchor="middle" letter-spacing="1">${escapeHtml(kat.toUpperCase())}</text></svg>`;
        return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    },
    imgFallback(el) { el.onerror = null; const name = el.getAttribute('data-name') || 'Produk Ecoprint'; const cat = el.getAttribute('data-cat') || 'Ecoprint Sabang'; el.src = Helpers.productIllustration(name, cat); }
};

const Cart = {
    get() { return DB.get('cart', []); },
    set(items) { DB.set('cart', items); },
    add(productId, qty) { const items = this.get(); const existing = items.find(i => i.productId === productId); if (existing) existing.qty += qty; else items.push({ productId, qty }); this.set(items); },
    update(productId, qty) { let items = this.get(); if (qty <= 0) items = items.filter(i => i.productId !== productId); else { const it = items.find(i => i.productId === productId); if (it) it.qty = qty; else items.push({ productId, qty }); } this.set(items); },
    remove(productId) { this.set(this.get().filter(i => i.productId !== productId)); },
    clear() { this.set([]); },
    count() { return this.get().reduce((s,i) => s + i.qty, 0); },
    detailed() { return this.get().map(i => { const p = DB.find('products', x => x.id === i.productId); return p ? { ...i, product: p } : null; }).filter(Boolean); },
    subtotal() { return this.detailed().reduce((s,i) => s + i.product.harga * i.qty, 0); }
};

    record(productId, jenis, jumlah, stokSebelum, stokSesudah, keterangan) { const p = DB.find('products', x => x.id === productId); const mov = { id: 'SM-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), tanggal: Helpers.date(), productId, productNama: p ? p.nama : '-', jenis, jumlah: Number(jumlah), stokSebelum: Number(stokSebelum), stokSesudah: Number(stokSesudah), keterangan: keterangan || '' }; DB.push('stockMovements', mov); return mov; },
    addStock(productId, jumlah, keterangan) { const p = DB.find('products', x => x.id === productId); if (!p) return false; jumlah = Number(jumlah); if (isNaN(jumlah) || jumlah <= 0) return false; const before = p.stok, after = before + jumlah; DB.update('products', x => x.id === productId, { stok: after }); this.record(productId, 'Stock Masuk', jumlah, before, after, keterangan); return true; },
    reduceStock(productId, jumlah, keterangan) { const p = DB.find('products', x => x.id === productId); if (!p) return false; const before = p.stok, after = before - jumlah; if (after < 0) return false; DB.update('products', x => x.id === productId, { stok: after }); this.record(productId, 'Terjual', jumlah, before, after, keterangan); return true; },

    history(productId) { return DB.filter('stockMovements', m => m.productId === productId).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)); },
    all() { return DB.get('stockMovements', []).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)); },
    summary(productId) { const p = DB.find('products', x => x.id === productId); if (!p) return null; const movements = this.history(productId); let masuk = 0, terjual = 0; movements.forEach(m => { if (m.jenis === 'Stock Masuk' || m.jenis === 'Retur') masuk += m.jumlah; else if (m.jenis === 'Terjual') terjual += m.jumlah; }); const stokAwal = p.stokAwal !== undefined ? p.stokAwal : p.stok; return { stokAwal, stokMasuk: masuk, terjual, stokAkhir: stokAwal + masuk - terjual, stokSekarang: p.stok }; }

        if (!p) return escapeHtml(Helpers.productIllustration('Produk', ''));
        const localPhoto = PhotoStorage.get(p.id);
        if (localPhoto) return escapeHtml(localPhoto);
        const raw = (p.foto && String(p.foto).trim()) ? String(p.foto).trim() : '';
        if (!raw) return escapeHtml(Helpers.productIllustration(p.nama, p.kategori));
        
        if (/^(https?:|data:|blob:|\/\/|\/|src\/|sumber\/)/i.test(raw)) {
            return escapeHtml(raw);
        }
        
        const folder = (State.getSettings().fotoFolder || 'sumber/produk/').trim();
        const sep = folder.endsWith('/') ? '' : '/';

    home() { const s = State.getSettings(); const products = DB.filter('products', p => p.aktif !== false); const featured = products.slice(0, 8); const slides = products.slice(0, 5); const slidesHtml = slides.length === 0 ? `<div class="slider-slide hero-slide"><div class="hero-inner" style="grid-template-columns:1fr;text-align:center;"><div class="hero-text"><span class="hero-badge">🌿 Ecoprint Sabang</span><h2>Selamat Datang di ecoprint store</h2><div class="hero-cta" style="justify-content:center;"><button class="btn hero-btn" onclick="State.renderPage('products')">Mulai Belanja</button></div></div></div></div>` : slides.map((p, i) => this.heroSlide(p, products, i)).join(''); return `<div style="padding:10px 0 30px;"><div class="skripsi-title">SISTEM INFORMASI PENJUALAN DAN PROMOSI UMKM ECOPRINT BERBASIS WEB DI KOTA SABANG<small>🌿 ecoprint store — Fashion Lokal Nusantara</small></div>${s.notification ? `<div class="info-banner">${escapeHtml(s.notification)}</div>` : ''}<div class="slider-container" id="sliderContainer"><div class="slider-track" id="sliderTrack">${slidesHtml}</div><button class="slider-btn prev" id="sliderPrev">‹</button><button class="slider-btn next" id="sliderNext">›</button><div class="slider-dots" id="sliderDots"></div></div><div class="promo-banner"><div class="text"><h2>${escapeHtml(s.promoText)}</h2><p>Dapatkan produk ecoprint terbaik dengan harga terjangkau.</p></div><button class="btn" onclick="State.renderPage('products')">${escapeHtml(s.promoButton)}</button></div><div class="section-title">🔥 Produk Unggulan</div><div class="grid-4">${featured.map(p => this.productCard(p)).join('')}</div><div style="text-align:center;margin-top:20px;"><button class="btn btn-primary" onclick="State.renderPage('products')">Lihat Semua Produk →</button></div></div>`; },

    productCard(p) { const badge = Helpers.stockStatus(p.stok); return `<div class="product-card"><div class="product-img"><img src="${this._img(p)}" alt="${escapeHtml(p.nama)}" loading="lazy" data-name="${escapeHtml(p.nama)}" data-cat="${escapeHtml(p.kategori)}" onerror="Helpers.imgFallback(this)" /><span class="brand-tag">${escapeHtml(p.kategori)}</span></div><div class="product-body"><div class="product-name">${escapeHtml(p.nama)}</div><div class="product-category">${escapeHtml(p.kategori)}</div><div class="product-price">${Helpers.formatRupiah(p.harga)}</div><div class="product-stock"><span class="badge ${badge.class}">${badge.label} · ${p.stok}</span></div><div class="product-actions"><button class="btn btn-primary btn-sm" onclick="State.renderPage('productDetail','${p.id}')">Detail</button>${p.stok > 0 ? `<button class="btn btn-success btn-sm" onclick="State.quickAdd('${p.id}')">+ Keranjang</button>` : `<button class="btn btn-secondary btn-sm" disabled>Habis</button>`}</div></div></div>`; },

    adminProducts() { const products = DB.get('products', []); const folder = State.getSettings().fotoFolder || 'sumber/produk/'; const localCount = PhotoStorage.count(); return `<div style="padding:10px 0 30px;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><div class="info-banner" style="background:var(--primary-light);margin-bottom:12px;">📁 Folder URL: <code style="background:rgba(0,0,0,.2);color:#fff;padding:1px 8px;border-radius:4px;">${escapeHtml(folder)}</code> · 📷 ${localCount} foto lokal — ubah di <a href="#" onclick="State.renderPage('adminSettings');return false;" style="color:#fff;text-decoration:underline;">Pengaturan</a></div><div class="flex-between flex-wrap" style="gap:12px;margin-bottom:16px;"><h2 class="section-title" style="margin-bottom:0;">📦 Kelola Produk</h2><button class="btn btn-primary" onclick="State.showAddProduct()">+ Tambah Produk</button></div>${products.length === 0 ? `<div class="empty-state"><div class="icon">📦</div><h3>Belum ada produk</h3></div>` : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Foto</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Foto Lokal</th><th>Aksi</th></tr></thead><tbody>${products.map(p => `<tr><td><img src="${this._img(p)}" data-name="${escapeHtml(p.nama)}" data-cat="${escapeHtml(p.kategori)}" onerror="Helpers.imgFallback(this)" style="width:44px;height:44px;object-fit:cover;border-radius:6px;" /></td><td><strong>${escapeHtml(p.nama)}</strong><div class="fs-12 text-muted">${p.id}</div></td><td>${escapeHtml(p.kategori)}</td><td>${Helpers.formatRupiah(p.harga)}</td><td>${p.stok}</td><td>${PhotoStorage.has(p.id) ? `<span class="badge badge-success">✅ Ada</span>` : `<span class="badge badge-secondary">—</span>`}</td><td style="display:flex;gap:4px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" onclick="State.showEditProduct('${p.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="State.deleteProduct('${p.     adminStock() { const products = DB.get('products', []); return `<div style="padding:10px 0 30px;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><h2 class="section-title">📥 Manajemen Stok</h2><div class="grid-2"><div class="card"><h3 class="card-title">➕ Tambah Stok Masuk</h3><div class="form-group"><label>Produk</label><select id="stockProduct"><option value="">Pilih produk...</option>${products.map(p => `<option value="${p.id}">${escapeHtml(p.nama)} (Stok: ${p.stok})</option>`).join('')}</select></div><div class="form-group"><label>Jumlah Stok Masuk</label><input type="number" id="stockQty" min="1" value="1" /></div><div class="form-group"><label>Keterangan</label><input type="text" id="stockNote" placeholder="Misal: Produksi baru" /></div><button class="btn btn-primary btn-block" onclick="State.addStockFromForm()">📥 Tambah Stok</button></div><div class="card"><h3 class="card-title">📊 Ringkasan Stok</h3><div class="table-wrap" style="max-height:400px;"><table><thead><tr><th>Produk</th><th>Stok</th><th>Status</th></tr></thead><tbody>${products.map(p => { const b = Helpers.stockStatus(p.stok); return `<tr><td>${escapeHtml(p.nama)}</td><td>${p.stok}</td><td><span class="badge ${b.class}">${b.label}</span></td></tr>`; }).join('')}</tbody></table></div></div></div><div class="card mt-16"><div class="flex-between"><h3 class="card-title">📋 Riwayat Pergerakan Stok (10 terbaru)</h3><button class="btn btn-outline btn-sm" onclick="State.renderPage('adminStockHistory')">Lihat Semua →</button></div>${(() => { const hist = Stock.all().slice(0, 10); if (hist.length === 0) return '<div class="text-muted">Belum ada riwayat.</div>'; return `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Produk</th><th>Jenis</th><th>Jumlah</th><th>Sebelum</th><th>Sesudah</th><th>Keterangan</th></tr></thead><tbody>${hist.map(m => `<tr><td>${Helpers.formatDate(m.tanggal)}</td><td>${escapeHtml(m.productNama)}</td><td><span class="badge     adminStockHistory() { const hist = Stock.all(); return `<div style="padding:10px 0 30px;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><h2 class="section-title">📋 Riwayat Stok Lengkap</h2>${hist.length === 0 ? `<div class="empty-state"><div class="icon">📋</div><h3>Belum ada riwayat</h3></div>` : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Produk</th><th>Jenis</th><th>Jumlah</th><th>Stok Sebelum</th><th>Stok Sesudah</th><th>Keterangan</th></tr></thead><tbody>${hist.map(m => `<tr><td>${Helpers.formatDateTime(m.tanggal)}</td><td>${escapeHtml(m.productNama)}</td><td><span class="badge ${m.jenis==='Terjual'?'badge-warning':m.jenis==='Retur'?'badge-info':'badge-success'}">${m.jenis}</span></td><td>${m.jenis==='Terjual'?'-':'+'}${m.jumlah}</td><td>${m.stokSebelum}</td><td>${m.stokSesudah}</td><td>${escapeHtml(m.keterangan)||'-'}</td></tr>`).join('')}</tbody></table></div></div>`}</div>`; },
    adminOrders() { const trx = DB.get('transactions', []).slice().reverse(); return `<div style="padding:10px 0 30px;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><h2 class="section-title">📋 Kelola Pesanan</h2>${trx.length === 0 ? `<div class="empty-state"><div class="icon">📋</div><h3>Belum ada pesanan</h3></div>` : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Tanggal</th><th>Nama</th><th>WA</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${trx.map(t => `<tr><td><a href="#" onclick="State.renderPage('invoice','${t.id}');return false;" style="color:var(--primary);font-weight:700;">${t.id}</a></td><td>${t.tanggal}</td><td>${escapeHtml(t.customer.nama)}</td><td>${escapeHtml(t.customer.whatsapp)}</td><td>${Helpers.formatRupiah(t.total)}</td><td><span class="badge status-badge-${STATUS_PESANAN.indexOf(t.status)}">${t.status}</span></td><td style="display:flex;gap:4px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" onclick="State.renderPage('invoice','${t.id}')">📄</button><select onchange="State.changeOrderStatus('${t.id}', this.value)" style="padding:4px 8px;font-size:12px;border-radius:8px;border:1px solid var(--border);">${STATUS_PESANAN.map(s => `<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}</div>`; },
    adminSales() { const trx = DB.get('transactions', []).slice().reverse(); const validTrx = trx.filter(t => t.status !== 'Dibatalkan'); const totalPendapatan = validTrx.reduce((s,t) => s + t.total, 0); const totalBarang = validTrx.reduce((s,t) => s + t.items.reduce((ss,i) => ss+i.qty, 0), 0); return `<div style="padding:10px 0 30px;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><div class="flex-between flex-wrap" style="gap:12px;margin-bottom:16px;"><h2 class="section-title" style="margin-bottom:0;">💰 Rekap Penjualan</h2><button class="btn btn-outline no-print" onclick="window.print()">🖨️ Cetak</button></div><div class="grid-3" style="margin-bottom:20px;"><div class="stat-card purple"><div class="stat-label">Total Transaksi</div><div class="stat-value">${trx.length}</div></div><div class="stat-card green"><div class="stat-label">Total Barang Terjual</div><div class="stat-value">${totalBarang}</div></div><div class="stat-card pink"><div class="stat-label">Total Pendapatan</div><div class="stat-value" style="font-size:20px;">${Helpers.formatRupiah(totalPendapatan)}</div></div></div><div class="card no-print"><div class="flex-between flex-wrap" style="gap:8px;margin-bottom:12px;"><div class="form-group" style="margin:0;flex:1;min-width:150px;"><label>Filter Status</label><select id="filterStatus" onchange="State.filterSales()"><option value="">Semua</option>${STATUS_PESANAN.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div><div class="form-group" style="margin:0;flex:1;min-width:150px;"><label>Cari</label><input type="text" id="filterSearch" placeholder="Nama / Invoice" oninput="State.filterSales()" /></div></div></div><div class="card mt-16"><div class="table-wrap" id="salesTable"><table><thead><tr><th>ID Transaksi</th><th>Tanggal</th><th>Nama Pembeli</th><th>WhatsApp</th><th>Produk</th><th>Qty</th><th>Total</th><th>Metode</th><th>Status</th></tr></thead><tbody>${this._salesRows(trx)}</tbody></table></div></div></div>`; },
    _salesRows(trx) { if (!trx || trx.length === 0) return `<tr><td colspan="9" style="text-align:center;color:var(--text-light);padding:20px;">Tidak ada data</td></tr>`; return trx.map(t => t.items.map((it,idx) => `<tr>${idx===0?`<td rowspan="${t.items.length}"><strong>${t.id}</strong></td><td rowspan="${t.items.length}">${t.tanggal}</td><td rowspan="${t.items.length}">${escapeHtml(t.customer.nama)}</td><td rowspan="${t.items.length}">${escapeHtml(t.customer.whatsapp)}</td>`:''}<td>${escapeHtml(it.nama)}</td><td>${it.qty}</td>${idx===0?`<td rowspan="${t.items.length}"><strong>${Helpers.formatRupiah(t.total)}</strong></td><td rowspan="${t.items.length}">${escapeHtml(t.paymentMethod)}</td><td rowspan="${t.items.length}"><span class="badge status-badge-${STATUS_PESANAN.indexOf(t.status)}">${t.status}</span></td>`:''}</tr>`).join('')).join(''); },
    adminTopProducts() { const trx = DB.get('transactions', []).filter(t => t.status !== 'Dibatalkan'); const sales = {}; trx.forEach(t => t.items.forEach(it => { if (!sales[it.productId]) sales[it.productId] = { productId: it.productId, nama: it.nama, kategori: it.kategori, qty: 0, pendapatan: 0, harga: it.harga }; sales[it.productId].qty += it.qty; sales[it.productId].pendapatan += it.subtotal; })); const sorted = Object.values(sales).sort((a,b) => b.qty - a.qty); return `<div style="padding:10px 0 30px;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><h2 class="section-title">🏆 Produk Terlaris</h2>${sorted.length === 0 ? `<div class="empty-state"><div class="icon">🏆</div><h3>Belum ada penjualan</h3></div>` : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Ranking</th><th>Produk</th><th>Kategori</th><th>Terjual</th><th>Harga</th><th>Pendapatan</th></tr></thead><tbody>${sorted.map((s,i) => `<tr><td><strong>#${i+1}</strong></td><td>${escapeHtml(s.nama)}</td><td>${escapeHtml(s.kategori)}</td><td>${s.qty} pcs</td><td>${Helpers.formatRupiah(s.harga)}</td><td>${Helpers.formatRupiah(s.pendapatan)}</td></tr>`).join('')}</tbody></table></div></div>`}</div>`; },

    adminSettings() { const s = State.getSettings(); const photoCount = PhotoStorage.count(); const photoKB = PhotoStorage.sizeKB(); const percent = Math.min(100, Math.round((photoKB / 5000) * 100)); const barClass = percent > 70 ? 'storage-bar-fill warn' : 'storage-bar-fill'; return `<div style="padding:10px 0 30px;max-width:800px;margin:0 auto;"><div class="back-nav"><button class="btn-back" onclick="State.goBack()">← Kembali</button></div><h2 class="section-title">⚙️ Pengaturan Toko</h2><div class="card"><form onsubmit="return State.saveSettingsForm(event)"><div class="form-group"><label>Warna Utama</label><input type="color" id="setPrimary" value="${s.primary}" /></div><div class="form-group"><label>Warna Sekunder</label><input type="color" id="setSecondary" value="${s.secondary}" /></div><div class="form-group"><label>Teks Promosi Banner</label><input type="text" id="setPromoText" value="${escapeHtml(s.promoText)}" /></div><div class="form-group"><label>Tombol Promosi</label><input type="text" id="setPromoButton" value="${escapeHtml(s.promoButton)}" /></div><div class="form-group"><label>Notifikasi Banner Atas</label><input type="text" id="setNotification" value="${escapeHtml(s.notification)}" /></div><div class="form-group"><label>📁 Folder URL Foto (alternatif)</label><input type="text" id="setFotoFolder" value="${escapeHtml(s.fotoFolder || 'sumber/produk/')}" placeholder="sumber/produk/ atau https://cdn.domain.com/produk/" /><div class="help">Dipakai HANYA jika Anda tidak upload foto dari komputer. Produk dengan kolom foto berisi nama file akan digabung dengan folder ini.</div></div><div class="form-group"><label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="setDarkMode" ${s.darkMode?'checked':''} style="width:auto;" /> Mode Gelap</label></div><button type="submit" class="btn btn-primary btn-block">💾 Simpan Pengaturan</button></form></div><div class="card mt-16"><h3 class="card-title">📷 Upload Foto Produk dari Komputer</h3><p class="help" style="margin-bottom
